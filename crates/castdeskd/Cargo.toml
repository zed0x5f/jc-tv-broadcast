[package]
name = "castdeskd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.12.3", default-features = false, features = ["tokio"] }
axum = { version = "0.8.9", features = ["ws"] }
castdesk-core = { version = "0.1.0", path = "../castdesk-core" }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
gst = { version = "0.24.5", package = "gstreamer", features = ["v1_22"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
which = "8.0.6"
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }
